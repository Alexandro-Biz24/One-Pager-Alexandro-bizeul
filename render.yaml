# Root Directory du service Render :
# - dépôt = ce dossier `site`  → rootDir: api
# - dépôt = le mémoire parent → rootDir: site/api  (et déplace ce fichier à la racine)
services:
  - type: web
    name: alexandro-bizeul-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
